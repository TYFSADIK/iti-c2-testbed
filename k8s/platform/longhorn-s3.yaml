apiVersion: v1
kind: Secret
metadata:
  name: longhorn-s3
  namespace: longhorn-system
stringData:
  AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY}"
  AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY}"
  AWS_ENDPOINTS: "${S3_ENDPOINT}"
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: nightly-backup
  namespace: longhorn-system
spec:
  task: backup
  cron: "0 2 * * *"
  groups: [default]
  retain: 7
  concurrency: 2

# Velero: Kubernetes object backups (namespaces, deployments, secrets) to the S3 store.
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.10.1
    volumeMounts: [{mountPath: /target, name: plugins}]
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: c2-velero
      prefix: "${SITE_NAME}"
      config: {region: us-east-1, s3ForcePathStyle: "true", s3Url: "${S3_ENDPOINT}"}
  volumeSnapshotLocation: []
credentials:
  useSecret: true
  secretContents:
    cloud: |
      [default]
      aws_access_key_id=${S3_ACCESS_KEY}
      aws_secret_access_key=${S3_SECRET_KEY}
snapshotsEnabled: false
schedules:
  hourly:
    schedule: "0 * * * *"
    template: {ttl: 168h, includedNamespaces: [c2, metallb-system]}

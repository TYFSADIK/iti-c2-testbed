# Same database credentials at every site, so a promoted standby works with the same app.
apiVersion: v1
kind: Secret
metadata:
  name: c2-db-credentials
  namespace: c2
type: kubernetes.io/basic-auth
stringData:
  username: app
  password: "${DB_PASSWORD}"
---
apiVersion: v1
kind: Secret
metadata:
  name: c2-backup-s3
  namespace: c2
stringData:
  ACCESS_KEY_ID: "${S3_ACCESS_KEY}"
  SECRET_ACCESS_KEY: "${S3_SECRET_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: c2board-db
  namespace: c2
stringData:
  DATABASE_URL: "postgresql://app:${DB_PASSWORD}@c2db-rw.c2.svc:5432/app"

name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest==8.3.3 pyyaml==6.0.2
      - run: python -m pytest -q
      - run: shellcheck local/rehearse.sh chaos/run.sh tools/gen-secrets.sh proxmox/setup-network.sh ansible/roles/router/files/wan-impair

  image:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/tyfsadik/iti-c2-testbed:latest
          labels: org.opencontainers.image.source=https://github.com/TYFSADIK/iti-c2-testbed

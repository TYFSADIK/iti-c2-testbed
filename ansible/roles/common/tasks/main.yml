- name: Wait for cloud-init
  ansible.builtin.command: cloud-init status --wait
  changed_when: false

- name: Base packages
  ansible.builtin.apt:
    name: [qemu-guest-agent, chrony, curl, jq, open-iscsi, nfs-common, iproute2]
    update_cache: true
    cache_valid_time: 3600

- name: Services on
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [qemu-guest-agent, chrony, iscsid]

- name: Timezone UTC
  community.general.timezone:
    name: UTC

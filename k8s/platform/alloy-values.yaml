# Grafana Alloy on every node: metrics to the central Prometheus, pod logs to Loki, both labelled with the site.
alloy:
  configMap:
    content: |
      prometheus.exporter.unix "node" { }
      prometheus.scrape "node" {
        targets    = prometheus.exporter.unix.node.targets
        forward_to = [prometheus.remote_write.central.receiver]
      }
      discovery.kubernetes "pods" { role = "pod" }
      discovery.relabel "scrape" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
          regex = "true"
          action = "keep"
        }
      }
      prometheus.scrape "pods" {
        targets    = discovery.relabel.scrape.output
        forward_to = [prometheus.remote_write.central.receiver]
      }
      prometheus.scrape "ksm" {
        targets    = [{"__address__" = "kube-state-metrics.monitoring.svc:8080"}]
        forward_to = [prometheus.remote_write.central.receiver]
      }
      prometheus.remote_write "central" {
        endpoint { url = "http://${MGMT_IP}:9090/api/v1/write" }
        external_labels = { site = "${SITE_NAME}" }
      }
      discovery.relabel "logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
      }
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.logs.output
        forward_to = [loki.write.central.receiver]
      }
      loki.write "central" {
        endpoint { url = "http://${MGMT_IP}:3100/loki/api/v1/push" }
        external_labels = { site = "${SITE_NAME}" }
      }
  mounts:
    varlog: true
controller:
  type: daemonset
